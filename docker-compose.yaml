services:
  vdoninja-monitor:
    image: firefly27/video_nyanya:latest
    restart: unless-stopped
    network_mode: host   # без NAT-оверхеда и без ручного маппинга портов
    environment:
      - REMOTE_DEBUG_PORT=9223
    volumes:
      # HTML лежит рядом с этим compose-файлом под именем monitor.html
      - ./monitor.html:/app/html/monitor.html:ro
      # Персистентный профиль браузера — сохраняет localStorage/настройки между перезапусками
      - ./browser-profile:/app/browser-profile
      # Логи наружу, чтобы не терялись при пересборке контейнера
      - ./logs:/app/logs
